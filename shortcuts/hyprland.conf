sed -i "s/stats\['max_buffer_bytes'\] \/ 1024 \/ 1024/int(stats['max_buffer_bytes']) \/ 1024 \/ 1024/" ~/clipArch/ui/toolbar.py# ─────────────────────────────────────────────────────────────────────────────
# Clipboard Manager — Hyprland integration
# author: teddyBear
#
# Paste these lines into your ~/.config/hypr/hyprland.conf
# ─────────────────────────────────────────────────────────────────────────────

# Start the clipboard manager daemon on login (runs in background, no window)
exec-once = "$PYTHON_BIN" ~/.local/bin/clipboard-manager/main.py

# 2. Add the WIN+V shortcut
bind = SUPER, V, exec, pkill -SIGUSR1 -f '"$PYTHON_BIN".*main.py' || true
